<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacelab</title>
    <style>
        body { max-width: 760px; margin: 48px auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #17212b; }
        header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #fc4c02; }
        button, a.button { background: #fc4c02; border: 0; color: white; padding: 10px 14px; font: inherit; text-decoration: none; cursor: pointer; }
        .notice { padding: 12px; background: #e6f4ea; } .error { padding: 12px; background: #fce8e6; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; } th, td { padding: 9px 4px; border-bottom: 1px solid #d7dde3; text-align: left; }
    </style>
</head>
<body>
<header><h1>Pacelab</h1><p>Strava activity tester</p></header>
<p class="notice" th:if="${message}" th:text="${message}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<section th:if="${connected}">
    <p>Strava is connected for this browser session.</p>
    <form method="post" action="/strava/import"><button type="submit">Import Strava activities</button></form>
</section>
<section th:unless="${connected}">
    <p>Connect Strava to import runs, rides, and strength activities.</p>
    <a class="button" href="/strava/connect">Connect Strava</a>
</section>
<h2>Local workouts</h2>
<table th:if="${!#lists.isEmpty(workouts)}">
    <thead><tr><th>When</th><th>Type</th><th>Duration</th><th>Distance</th><th>Source</th></tr></thead>
    <tbody><tr th:each="workout : ${workouts}"><td th:text="${workout.startedAt}"></td><td th:text="${workout.type}"></td><td th:text="${workout.durationMinutes + ' min'}"></td><td th:text="${workout.distanceKilometers == null ? '-' : workout.distanceKilometers + ' km'}"></td><td th:text="${workout.source}"></td></tr></tbody>
</table>
<p th:if="${#lists.isEmpty(workouts)}">No workouts imported yet.</p>
</body>
</html>
